<main class="detail" *ngIf="product"><a routerLink="/products">← Back to Products</a><section><img [src]="product.image" [alt]="product.name"><div><span>{{product.group}}</span><h1>{{product.name}}</h1><p>{{product.description}}</p><div class="facts"><b>₹{{product.price}} / {{product.unit}}</b><b>{{product.stock}} kg available</b></div><button (click)="add()">Add to Cart</button><a routerLink="/cart">Go to Cart →</a></div></section></main><main *ngIf="!product" class="detail"><h2>Product not found</h2><a routerLink="/products">Browse Products</a></main>

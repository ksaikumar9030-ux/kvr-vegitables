<main class="page"><span class="tag">PRODUCT CATALOGUE</span><div class="title"><div><h1>Vegetables & Dry Sea Fish</h1><p>Fresh daily essentials and coastal dry fish.</p></div><a routerLink="/cart">🛒 {{store.cartCount()}} items</a></div><div class="filters"><input [(ngModel)]="search" placeholder="Search products..."><select [(ngModel)]="group"><option>All</option><option>Vegetable</option><option>Dry Fish</option></select></div><div class="grid"><article *ngFor="let p of list"><img [src]="p.image" [alt]="p.name"><div><small>{{p.group}}</small><h2>{{p.name}}</h2><p>{{p.description}}</p><div class="meta">📦 {{p.stock}} kg stock</div><strong>₹{{p.price}} / {{p.unit}}</strong><button (click)="add(p)">+ Add to Cart</button><a [routerLink]="[p.id]" class="details">View Details →</a></div></article></div></main>

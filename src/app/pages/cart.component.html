<main class="page"><span class="tag">ORDER CART</span><h1>Your Cart</h1><section *ngIf="store.items().length;else empty" class="layout"><div><article *ngFor="let i of store.items()"><img [src]="i.product.image"><div><h3>{{i.product.name}}</h3><small>₹{{i.product.price}} / {{i.product.unit}}</small><div class="qty"><button (click)="store.update(i.product.id,i.qty-1)">−</button><b>{{i.qty}}</b><button (click)="store.update(i.product.id,i.qty+1)">+</button></div></div><strong>₹{{i.qty*i.product.price}}</strong><button class="remove" (click)="store.remove(i.product.id)">Remove</button></article></div><aside><h2>Summary</h2><p>Items <b>{{store.cartCount()}}</b></p><p>Total <b>₹{{store.cartTotal()}}</b></p><hr><p class="note">Customer order form and WhatsApp checkout can be connected here.</p><button (click)="store.clear()">Clear Cart</button></aside></section><ng-template #empty><div class="empty">🛒<h2>Your cart is empty</h2><a routerLink="/products">Browse Products</a></div></ng-template></main>
